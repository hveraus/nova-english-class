.nav-name{font-size:14px;font-weight:600}.nav-sub{font-size:11px;color:var(--text3);margin-top:1px}
.nav-tabs{display:flex;gap:2px;flex:1}
.nav-tab{padding:6px 14px;border-radius:6px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;border:none;background:none;transition:all .15s}
.nav-tab:hover{background:var(--surface2);color:var(--text)}
.nav-tab.active{background:var(--text);color:var(--bg)}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:4px}
.ls-btn{width:30px;height:28px;border-radius:6px;font-size:12px;font-weight:600;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.ls-btn:hover{border-color:var(--text);color:var(--text)}
.ls-btn.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.page{display:none;padding:24px;max-width:960px;margin:0 auto}.page.active{display:block}
.stitle{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.25rem}
.mc{background:var(--surface2);border-radius:10px;padding:13px 14px}
.mc-label{font-size:11px;color:var(--text2);margin-bottom:5px}
.mc-val{font-size:22px;font-weight:500;line-height:1}
.mc-sub{font-size:11px;color:var(--text3);margin-top:4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1.25rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1rem 1.25rem;margin-bottom:1.25rem}
.card.no-mb{margin-bottom:0}
.sr{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--surface2)}
.sr:last-child{border-bottom:none}
.sn{font-size:13px;flex:1}
.sbw{width:90px;height:5px;background:var(--surface2);border-radius:3px;overflow:hidden}
.sb{height:100%;border-radius:3px}
.spct{font-size:11px;font-weight:600;font-family:var(--mono);width:28px;text-align:right}
.hb{border-radius:0 8px 8px 0;padding:8px 12px;margin-bottom:5px;font-size:13px;line-height:1.55}
.hb:last-child{margin-bottom:0}
.hg{background:var(--green-bg);color:var(--green-text);border-left:2.5px solid var(--green)}
.hw{background:var(--amber-bg);color:var(--amber-text);border-left:2.5px solid var(--amber)}
.hn{background:var(--surface2);color:var(--text2);border-left:2.5px solid var(--border2);font-size:12px}
.dim-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--surface2)}
.dim-row:last-child{border-bottom:none}
.dim-label{font-size:12px;width:80px;flex-shrink:0}
.dim-blocks{display:flex;gap:3px}
.db{width:12px;height:12px;border-radius:2px}
.dim-note{font-size:11px;color:var(--text3);margin-left:auto;text-align:right;max-width:180px}
.tag-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500}
.tag-g{background:var(--green-bg);color:var(--green-text)}
.tag-a{background:var(--amber-bg);color:var(--amber-text)}
.tag-p{background:var(--purple-bg);color:var(--purple-text)}
.ml-list{display:flex;flex-direction:column;gap:4px}
.mi{display:flex;align-items:flex-start;gap:9px;padding:7px 10px;background:var(--surface2);border-radius:8px}
.mi-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px}
.mi-text{font-size:13px;line-height:1.4}
.mi-sub{font-size:11px;color:var(--text3);display:block;margin-top:1px}
.ts-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1.25rem}
.ts-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1rem 1.25rem}
.ts-title{font-size:13px;font-weight:500;margin-bottom:10px}
.ts-sub{font-size:11px;color:var(--text3);font-weight:400}
table{width:100%;border-collapse:collapse}
th{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;padding:0 0 8px;text-align:left;border-bottom:1px solid var(--border)}
td{font-size:13px;padding:6px 0;border-bottom:1px solid var(--surface2);vertical-align:middle}
tr:last-child td{border-bottom:none}
.td-note{font-size:11px;color:var(--text3);display:block;margin-top:1px}
.pill{display:inline-block;font-size:10px;padding:2px 7px;border-radius:20px;font-weight:600;font-family:var(--mono)}
.pill-fast{background:var(--green-bg);color:var(--green-text)}
.pill-mid{background:var(--amber-bg);color:var(--amber-text)}
.pill-slow{background:var(--red-bg);color:var(--red-text)}
.pill-ok{background:var(--purple-bg);color:var(--purple-text)}
.tbar-wrap{display:flex;align-items:center;gap:6px}
.tbar-bg{flex:1;height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;min-width:40px}
.tbar-fill{height:100%;border-radius:3px}
.tbar-val{font-size:11px;font-weight:600;font-family:var(--mono);width:28px;text-align:right;flex-shrink:0}
.info-box{margin-top:10px;padding:8px 10px;border-radius:8px;font-size:12px;line-height:1.6}
.info-g{background:var(--green-bg);color:var(--green-text)}
.info-a{background:var(--amber-bg);color:var(--amber-text)}
.info-n{background:var(--surface2);color:var(--text2)}
.lesson-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:3px 10px;border-radius:20px;background:var(--surface2);color:var(--text2);margin-bottom:1.25rem}
.summary-text{font-size:13px;line-height:1.75;background:var(--surface2);border-radius:10px;padding:14px}
/* progress page */
.trend-tbl{width:100%;border-collapse:collapse}
.trend-tbl th{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;padding:0 10px 10px 0;text-align:left;border-bottom:1px solid var(--border)}
.trend-tbl td{font-size:13px;padding:8px 10px 8px 0;border-bottom:1px solid var(--surface2);vertical-align:middle}
.trend-tbl tr:last-child td{border-bottom:none}
.t-up{color:var(--green);font-weight:600}.t-dn{color:var(--red);font-weight:600}.t-eq{color:var(--text3)}
.t-note{font-size:11px;color:var(--text3)}
.stb-row{padding:8px 0;border-bottom:1px solid var(--surface2)}
.stb-row:last-child{border-bottom:none}
.stb-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.stb-name{font-size:13px}
.stb-vals{font-size:11px;font-family:var(--mono);color:var(--text3);display:flex;gap:8px}
.stb-b{height:5px;border-radius:3px}
.prog-dots{display:flex;gap:4px;margin:6px 0 4px}
.pd{height:6px;border-radius:2px;flex:1}
.foot{font-size:11px;color:var(--text3);padding:14px 24px;max-width:960px;margin:0 auto;border-top:1px solid var(--border)}
.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.mod-card{display:flex;align-items:flex-start;gap:10px;padding:10px 13px;background:var(--surface2);border-radius:8px;border-left:3px solid transparent}
.mod-n{font-size:10px;font-weight:700;color:var(--text3);flex-shrink:0;padding-top:2px;min-width:14px}
.mod-body{min-width:0}
.mod-name{font-size:12px;font-weight:600;line-height:1.4}
.mod-sub{font-size:11px;color:var(--text3);margin-top:2px;line-height:1.5}
.mod-vocab{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.vocab-chip{font-size:10px;font-family:var(--mono);font-weight:500;padding:1px 7px;border-radius:3px;background:rgba(0,0,0,.07);color:var(--text2);border:1px solid rgba(0,0,0,.06)}
.vocab-chip.repeat{background:#d4edda;color:#1e6e34;border-color:#b8dfc5}
.vocab-section-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.vocab-group{padding:12px 14px;background:var(--surface2);border-radius:8px;border:1px solid var(--border)}
.vocab-group-title{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.vocab-group-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.vocab-group-words{display:flex;flex-wrap:wrap;gap:4px}
.pattern-list{display:flex;flex-direction:column;gap:8px}
.pattern-row{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;background:var(--surface2);border-radius:8px}
.pattern-cat{font-size:10px;font-weight:600;padding:2px 7px;border-radius:3px;white-space:nowrap;flex-shrink:0;margin-top:1px}
.pattern-cat.动词变化{background:#e8f5e9;color:#2e7d32}
.pattern-cat.情态动词{background:#e3f2fd;color:#1565c0}
.pattern-cat.序数表达{background:#fce4ec;color:#880e4f}
.pattern-cat.信息类句型{background:#f3e5f5;color:#6a1b9a}
.pattern-cat.WH-疑问句{background:#fff8e1;color:#f57f17}
.pattern-cat.描述句型{background:#e0f7fa;color:#006064}
.pattern-cat.基本句型{background:#e8eaf6;color:#283593}
.pattern-cat.主谓宾{background:#fbe9e7;color:#bf360c}
.pattern-cat.代词替换{background:#e0f2f1;color:#004d40}
.pattern-body{min-width:0}
.pattern-text{font-size:12px;font-weight:600;font-family:var(--mono);color:var(--text)}
.pattern-example{font-size:11px;color:var(--text3);margin-top:2px;line-height:1.5}
.pattern-lesson-tag{font-size:10px;font-weight:600;padding:1px 6px;border-radius:3px;background:var(--surface2);color:var(--text3);border:1px solid var(--border);white-space:nowrap;flex-shrink:0;margin-top:2px}
.err-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.err-bar-label{font-size:11px;color:var(--text2);width:80px;flex-shrink:0;text-align:right}
.err-bar-track{flex:1;height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.err-bar-fill{height:100%;border-radius:4px;background:var(--amber)}
.err-bar-count{font-size:11px;color:var(--text3);width:24px;flex-shrink:0}
.err-type-desc{font-size:10px;color:var(--text3);margin-top:1px}
.capture-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:7px;font-size:12px;font-weight:500;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;transition:all .15s;flex-shrink:0;white-space:nowrap}
.capture-btn:hover{border-color:var(--text);color:var(--text)}
.capture-btn:disabled{opacity:.45;cursor:not-allowed}
/* ── TREND CHARTS ──────────────────────────────────── */

.cc-title{font-size:13px;font-weight:600}
.cc-q{font-size:12px;color:var(--text2)}
.cc-legend{display:flex;gap:12px;margin-top:8px;font-size:11px;color:var(--text2);flex-wrap:wrap}

.cc-dot{width:9px;height:9px;border-radius:2.5px;display:inline-block}

.cc-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.cc-stack{width:100%;max-width:44px;display:flex;flex-direction:column;justify-content:flex-end;border-radius:5px;overflow:hidden}
.cc-val{font-size:11px;font-weight:600;font-family:var(--mono);margin-bottom:3px}
.cc-x{display:flex;gap:10px;margin-top:6px}
.cc-xl{flex:1;text-align:center;font-size:11px;font-weight:600;color:var(--text2)}
.cc-xl small{display:block;font-size:9px;font-weight:400;color:var(--text3);margin-top:1px}
.cc-note{font-size:11px;color:var(--text3);margin-top:10px;padding-top:8px;border-top:1px solid var(--surface2);line-height:1.6}
.cc-wrow{display:flex;align-items:center;gap:10px;padding:4px 0}
.cc-wlab{width:210px;flex-shrink:0;font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-wlab strong{color:var(--text);font-family:var(--mono)}
.cc-wtrack{flex:1;height:12px;background:var(--surface2);border-radius:6px;overflow:hidden}
.cc-wfill{height:100%;border-radius:6px}
.cc-wsec{width:44px;text-align:right;font-size:11px;font-weight:600;font-family:var(--mono);flex-shrink:0}
/* ── CALENDAR ──────────────────────────────────────── */
.cal-months{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:12px}
.cal-month{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 14px}
.cal-month-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:12px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-wday{font-size:10px;font-weight:600;color:var(--text3);text-align:center;padding:0 0 6px}
.cal-day{min-height:36px;padding:3px 2px;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px}
.cal-day.cal-today{outline:1.5px solid var(--border2)}
.cal-day.cal-lesson{background:var(--purple-bg)}
.cal-num{font-size:11px;color:var(--text3);line-height:1.2}
.cal-day.cal-lesson .cal-num{color:var(--purple-text);font-weight:600}
.cal-day.cal-today .cal-num{color:var(--text);font-weight:600}
.cal-badge{font-size:9px;font-weight:700;background:var(--purple);color:#fff;border-radius:3px;padding:1px 4px;cursor:pointer;white-space:nowrap;letter-spacing:.02em}
.cal-badge:hover{opacity:.8}
.cal-toprow{display:flex;align-items:baseline;gap:14px;margin-bottom:6px}
.cal-summary{font-size:13px;color:var(--text2)}
.cal-summary strong{color:var(--text);font-weight:600}
.cal-legend{display:flex;align-items:center;gap:6px;margin-top:14px;font-size:11px;color:var(--text3)}
.cal-legend-dot{width:9px;height:9px;border-radius:2px;background:var(--purple-bg);border:1px solid var(--purple);display:inline-block}
</style>

      "summary": "第9课以复习+新单元开篇为主线：复习 L 辅音与《Kim and Flick》细节，讲解复数名词-s 和 labels 文本特征，开启新单元 Let's Be Friends，并预习 Short O。本课最大亮点是单词书写显著提速（复数名词单题 7–12s，对比 L6 的 50–90s）；任务外停滞 0 次。主要挑战：Short O 词表独立混读、\"I like to paint\"句式 4 次重试、to/too/two 同音新难点。故事《Toss Kick Hop》留待下节课。"
    },
    "version_note": "文件名为\"7月15日\"但录音文件名 GMT20260714 及用户确认为 7 月 14 日课程；转录无说话人标注，通过对话内容推断（01:30 Nova \"Hi Ashley\"开场）；02:59 \"My name is Caroline Isaacs\"为转录异常文本（疑背景音/课件音频误录），不计入分析；04:13 出现葡语转录 blob；01:00–01:14 为课前残留，已排除"
  }
]
</script>

<script>
// ── helpers ──────────────────────────────────────
const $ = id => document.getElementById(id);
const el = (tag, cls, html='') => { const e=document.createElement(tag); if(cls)e.className=cls; if(html)e.innerHTML=html; return e; };
function latDist(rl){
  const keys = Object.keys(rl.dist||{}).sort((a,b)=>+a-+b);
  if(!keys.length) return `${rl.mean}s`;
  return keys.map(k=>`${k}s×${rl.dist[k]}`).join(' · ');
}
function scoreBlocks(score){
  const full=Math.floor(score), half=(score%1>=0.4&&score%1<0.9)?1:0, empty=5-full-half;
  return Array(full).fill('<div class="db" style="background:var(--green)"></div>').join('')+
    (half?'<div class="db" style="background:#9FE1CB"></div>':'')+
    Array(empty).fill('<div class="db" style="background:var(--surface2);border:1px solid var(--border)"></div>').join('');
}
function ratingPill(r){
  const m={fast:'pill-fast',mid:'pill-mid',slow:'pill-slow','alert':'pill-slow'};
  const l={fast:'流畅',mid:'中等',slow:'困难','alert':'⚠'};
  return `<span class="pill ${m[r]||'pill-ok'}">${l[r]||r}</span>`;
}
function barColor(s){return s>=75?'var(--green)':'var(--amber)';}
function tbarColor(r){return r==='fast'?'var(--green)':r==='slow'?'var(--red)':'var(--amber)';}

// ── LOAD DATA ────────────────────────────────────
const lessons = JSON.parse($('all-lessons').textContent);
const total = 10; // expected total lessons

// ── LESSON PAGE ──────────────────────────────────
function buildLessonPage(d) {
  const m = d.metrics;
  let html = `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem">
    <div class="lesson-badge" style="margin-bottom:0"><strong>第 ${d.lesson} 课</strong> · ${d.date} · 约 ${d.duration_min} 分钟 · ${d.time_range} · 授课教师 ${d.teacher}</div>
    <button class="capture-btn" onclick="captureCurrentPage(this)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg> 保存截图</button>
  </div>
  ${d.performance.summary ? `
  <div class="card" style="margin-bottom:1.25rem;border-left:3px solid var(--green);background:var(--surface)">
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span style="font-size:10px;font-weight:600;color:var(--green);text-transform:uppercase;letter-spacing:.08em">本课总结</span>
    </div>
    <p style="font-size:13px;line-height:1.75;color:var(--text);margin:0">${d.performance.summary}</p>
  </div>` : ''}
  ${d.version_note?`<div class="hb hn" style="margin-bottom:1rem">${d.version_note}</div>`:''}

  <div class="stitle">课程概览</div>
  <div class="metrics">
    <div class="mc"><div class="mc-label">课程时长</div><div class="mc-val">${d.duration_min}<span style="font-size:13px;font-weight:400">m</span></div><div class="mc-sub">${d.time_range}</div></div>
    <div class="mc"><div class="mc-label">内容模块</div><div class="mc-val">${d.modules.length}</div><div class="mc-sub">已记录模块数</div></div>
    <div class="mc"><div class="mc-label">跟读延迟分布</div><div class="mc-val" style="color:var(--green);font-size:16px;line-height:1.4;padding-top:3px">${latDist(m.repeat_latency)}</div><div class="mc-sub">${m.repeat_latency.n}次采样${m.repeat_latency.low_confidence?' · <span style="color:var(--amber-text)">样本少，低置信</span>':''}</div></div>
    <div class="mc"><div class="mc-label">任务外停滞 (≥30s)</div>
      <div class="mc-val" style="color:${m.gaps_offtask_count>0?'var(--red)':'var(--green)'}">${m.gaps_offtask_count}</div>
      <div class="mc-sub">任务内另有 ${m.gaps_task_count} 次（书写/操作耗时）</div></div>
  </div>

  <div class="stitle">本节课教学内容</div>
  <div class="card">
    <div class="mod-grid">
      ${d.modules.map((mod,i)=>{
        const words = mod.vocab||[];
        const vocabHtml = words.length ? `<div class="mod-vocab">${words.map(w=>`<span class="vocab-chip">${w}</span>`).join('')}</div>` : '';
        return `<div class="mod-card" style="border-left-color:${mod.color}"><span class="mod-n">${i+1}</span><div class="mod-body"><div class="mod-name">${mod.name}</div><div class="mod-sub">${mod.sub}</div>${vocabHtml}</div></div>`;
      }).join('')}
    </div>
  </div>

  ${(d.sentence_patterns||[]).length ? `
  <div class="stitle">本节课句型</div>
  <div class="card">
    <div class="pattern-list">
      ${(d.sentence_patterns||[]).map(p=>`
        <div class="pattern-row">
          <span class="pattern-cat ${p.category}">${p.category}</span>
          <div class="pattern-body">
            <div class="pattern-text">${p.pattern}</div>
            <div class="pattern-example">${p.example}</div>
          </div>
        </div>`).join('')}
    </div>
  </div>` : ''}

  <div class="stitle">时间码量化分析</div>
  <div class="ts-grid">
    <div class="ts-card">
      <div class="ts-title">跟读反应延迟 <span class="ts-sub">（老师结束 → Nova 开口）</span></div>
      <table><tr><th>场景</th><th style="text-align:right">延迟</th></tr>
      ${m.repeat_latency.samples.map(s=>`<tr><td>${s.scene}<span class="td-note">${s.ts}</span></td><td style="text-align:right"><span class="pill ${s.latency===0?'pill-fast':s.latency<=1?'pill-fast':s.latency<=2?'pill-mid':'pill-slow'}">${s.latency}s</span></td></tr>`).join('')}
      </table>
      <div class="info-box info-g">✓ ${m.repeat_latency.n}次采样，分布 <strong>${latDist(m.repeat_latency)}</strong>，最长 ${m.repeat_latency.max}s${m.repeat_latency.low_confidence?'<br>⚠ 样本数不足 8，均值仅供参考，不作跨课比较':''}</div>
    </div>
    <div class="ts-card">
      <div class="ts-title">任务耗时 <span class="ts-sub">（指令 → 完成）</span></div>
      <table><tr><th>任务</th><th>用时</th><th style="text-align:right">评级</th></tr>
      ${(()=>{const maxS=Math.max(...m.writing_tasks.map(t=>t.seconds));return m.writing_tasks.map(t=>`<tr><td>${t.name}${t.note?'<span class="td-note">'+t.note+'</span>':''}<span class="td-note">${t.ts}</span></td><td><div class="tbar-wrap"><div class="tbar-bg"><div class="tbar-fill" style="width:${Math.round(t.seconds/maxS*100)}%;background:${tbarColor(t.rating)}"></div></div><span class="tbar-val" style="color:${tbarColor(t.rating)}">${t.seconds}s</span></div></td><td style="text-align:right">${ratingPill(t.rating)}</td></tr>`).join('')})()}
      </table>
    </div>
  </div>
  <div class="ts-grid">
    <div class="ts-card">
      <div class="ts-title">注意力 / 长时沉默</div>
      <table><tr><th>时段</th><th>时长</th><th style="text-align:right">性质</th></tr>
      ${m.attention_gaps.map(g=>`<tr><td>${g.scene}${g.note?'<span class="td-note">'+g.note+'</span>':''}<span class="td-note">${g.ts}</span></td><td style="color:${g.flag?'var(--red-text)':'var(--text2)'};${g.flag?'font-weight:600':''}">${g.seconds}s</td><td style="text-align:right"><span class="pill ${g.flag?'pill-slow':'pill-ok'}">${g.flag?'⚠':g.type}</span></td></tr>`).join('')}
      </table>
      <div class="info-box info-n">≥30s 停滞共 <strong>${m.gaps_30s_count}</strong> 次：任务内 ${m.gaps_task_count} 次（书写/鼠标/翻页等任务耗时，属预期）· <strong>任务外 ${m.gaps_offtask_count} 次</strong>（理解/走神信号）</div>
    </div>
    <div class="ts-card">
      <div class="ts-title">错误 → 纠正耗时</div>
      <table><tr><th>错误</th><th>耗时</th><th style="text-align:right">提示</th></tr>
      ${(()=>{const maxE=Math.max(...m.error_corrections.map(e=>e.seconds));return m.error_corrections.map(e=>`<tr><td>${e.error}${e.note?'<span class="td-note">'+e.note+'</span>':''}<span class="td-note">${e.ts}</span></td><td><div class="tbar-wrap"><div class="tbar-bg"><div class="tbar-fill" style="width:${Math.round(e.seconds/maxE*100)}%;background:${e.seconds<=10?'var(--green)':e.seconds<=25?'var(--amber)':'var(--red)'}"></div></div><span class="tbar-val" style="color:${e.seconds<=10?'var(--green-text)':e.seconds<=25?'var(--amber-text)':'var(--red-text)'}">${e.seconds}s</span></div></td><td style="text-align:right"><span class="pill pill-mid">${e.prompt_type}</span></td></tr>`).join('')})()}
      </table>
    </div>
  </div>

  <div class="stitle">学生课堂表现</div>
  <div class="card">
    <div style="display:flex;gap:1.5rem">
      <div style="flex:1">
        <div style="font-size:13px;font-weight:500;margin-bottom:10px">各维度评分</div>
        ${d.performance.dimensions.map(dim=>`<div class="dim-row"><span class="dim-label">${dim.label}</span><div class="dim-blocks">${scoreBlocks(dim.score)}</div><span class="dim-note">${dim.note}</span></div>`).join('')}
        <div style="margin-top:10px;display:flex;gap:10px;font-size:11px;color:var(--text3)">
          <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:var(--green);display:inline-block"></span>优秀</span>
          <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:#9FE1CB;display:inline-block"></span>良好</span>
          <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:var(--surface2);border:1px solid var(--border);display:inline-block"></span>待加强</span>
        </div>
      </div>
      <div style="flex:1">
        <div style="font-size:13px;font-weight:500;margin-bottom:10px">典型课堂表现</div>
        ${d.performance.highlights_good.map(h=>`<div class="hb hg">${h}</div>`).join('')}
        ${d.performance.highlights_warn.map(h=>`<div class="hb hw">${h}</div>`).join('')}
        ${(d.performance.notes||[]).map(h=>`<div class="hb hn">${h}</div>`).join('')}
        <div class="tag-row">
          ${d.performance.teacher_feedback_pos.map(t=>`<span class="tag tag-g">${t}</span>`).join('')}
          ${d.performance.teacher_feedback_neg.map(t=>`<span class="tag tag-a">${t}</span>`).join('')}
          ${d.performance.teacher_feedback_neutral.map(t=>`<span class="tag tag-p">${t}</span>`).join('')}
        </div>
      </div>
    </div>
    <div style="margin-top:1rem;padding-top:1rem;border-top:1px solid var(--surface2)">
      <div class="summary-text">${d.performance.summary}</div>
    </div>
  </div>

  <div class="card no-mb">
    <div class="stitle" style="margin-bottom:10px">技能掌握度</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:0 24px">
      ${d.skills.map(s=>`<div class="sr"><span class="sn">${s.name}</span><div class="sbw" style="width:120px"><div class="sb" style="width:${s.pct}%;background:${barColor(s.pct)}"></div></div><span class="spct" style="color:${s.pct>=75?'var(--green-text)':'var(--amber-text)'}">${s.pct}%</span></div>`).join('')}
    </div>
  </div>`;
  return html;
}

// ── TREND CHARTS ──────────────────────────────────
function ccXAxis(){
  return `<div class="cc-x">${lessons.map(d=>`<div class="cc-xl">L${d.lesson}<small>${d.date.slice(5).replace('-','/')}</small></div>`).join('')}</div>`;
}

function buildTrendCharts() {
  // 1) latency: share of samples answered within 1s
  const latCols = lessons.map(d=>{
    const rl = d.metrics.repeat_latency, n = rl.samples.length||1;
    const fast = rl.samples.filter(s=>s.latency<=1).length;
    const mid  = rl.samples.filter(s=>s.latency===2).length;
    const slow = rl.samples.filter(s=>s.latency>=3).length;
    return `<div class="cc-col">
      <div class="cc-val" style="color:var(--green-text)">${Math.round(fast/n*100)}%</div>
      <div class="cc-stack" style="height:${Math.round(n>0?100:0)}%">
        ${slow?`<div style="height:${slow/n*100}%;background:var(--red)"></div>`:''}
        ${mid?`<div style="height:${mid/n*100}%;background:var(--amber)"></div>`:''}
        <div style="height:${fast/n*100}%;background:var(--green)"></div>
      </div>
      <div style="font-size:9px;color:var(--text3);margin-top:3px">n=${rl.n}${rl.low_confidence?'*':''}</div>
    </div>`;
  }).join('');

  // 2) off-task gaps
  const maxOff = Math.max(1,...lessons.map(d=>d.metrics.gaps_offtask_count));
  const offCols = lessons.map(d=>{
    const v = d.metrics.gaps_offtask_count;
    return `<div class="cc-col">
      <div class="cc-val" style="color:${v===0?'var(--green-text)':'var(--red-text)'}">${v===0?'✓':v+'次'}</div>
      <div class="cc-stack" style="height:${v===0?3:Math.max(10,v/maxOff*100)}%">
        <div style="height:100%;background:${v===0?'var(--green)':'var(--red)'}"></div>
      </div>
    </div>`;
  }).join('');

  // 3) error rate per 10 min
  const maxErr = Math.max(...lessons.map(d=>d.metrics.errors_per_10min||0), 0.1);
  const errCols = lessons.map(d=>{
    const v = d.metrics.errors_per_10min;
    return `<div class="cc-col">
      <div class="cc-val" style="color:var(--amber-text)">${v}</div>
      <div class="cc-stack" style="height:${Math.max(6, v/maxErr*100)}%">
        <div style="height:100%;background:var(--amber)"></div>
      </div>
      <div style="font-size:9px;color:var(--text3);margin-top:3px">共${d.metrics.errors_count}次</div>
    </div>`;
  }).join('');

  // 4) representative writing task per lesson (slowest)
  const wRows = lessons.map(d=>{
    const w = [...d.metrics.writing_tasks].sort((a,b)=>b.seconds-a.seconds)[0];
    return {lesson:d.lesson, name:w.name, seconds:w.seconds, rating:w.rating};
  });
  const maxW = Math.max(...wRows.map(w=>w.seconds));
  const wHtml = wRows.map(w=>`
    <div class="cc-wrow">
      <div class="cc-wlab"><strong>L${w.lesson}</strong> · ${w.name}</div>
      <div class="cc-wtrack"><div class="cc-wfill" style="width:${Math.max(2,Math.round(w.seconds/maxW*100))}%;background:${tbarColor(w.rating)}"></div></div>
      <div class="cc-wsec" style="color:${tbarColor(w.rating)}">${w.seconds}s</div>
    </div>`).join('');

  return `
  <div class="stitle">跨课次趋势（图表）</div>

  <div class="card">
    <div class="cc-head"><span class="cc-title">① 跟读反应速度</span><span class="cc-q">老师说完一个词/句，Nova 多快跟着说出来？绿色越多越好</span></div>
    <div class="cc-cols">${latCols}</div>
    ${ccXAxis()}
    <div class="cc-legend">
      <span><span class="cc-dot" style="background:var(--green)"></span>1秒内开口（好）</span>
      <span><span class="cc-dot" style="background:var(--amber)"></span>2秒</span>
      <span><span class="cc-dot" style="background:var(--red)"></span>3秒以上（慢）</span>
    </div>
    <div class="cc-note">柱顶百分比 = 1秒内开口的比例。${lessons.length}课始终保持在 ${Math.min(...lessons.map(d=>{const ss=d.metrics.repeat_latency.samples;return Math.round(ss.filter(s=>s.latency<=1).length/(ss.length||1)*100);}))}% 以上，说明"听到→跟着说"的通道一直很稳。带 * 的课次采样少（书写为主的课），参考即可。</div>
  </div>

  <div class="card">
    <div class="cc-head"><span class="cc-title">② 专注度：没有任务时是否发呆</span><span class="cc-q">课堂上没在写字/操作时，出现过 ≥30 秒的沉默吗？✓ = 零次</span></div>
    <div class="cc-cols">${offCols}</div>
    ${ccXAxis()}
    <div class="cc-note">写字、用鼠标、翻页时的长时间沉默是正常的任务耗时，<strong>不算走神</strong>，已从这里排除（各课的任务耗时见"课次记录"页）。${lessons.length}课里真正的任务外停滞合计仅 ${lessons.reduce((s,d)=>s+d.metrics.gaps_offtask_count,0)} 次，专注度整体良好；出现停滞的课次多与页面理解困难相关，属理解卡顿而非走神。</div>
  </div>

  <div class="card">
    <div class="cc-head"><span class="cc-title">③ 朗读错误密度</span><span class="cc-q">平均每上课 10 分钟，朗读/书写出错几次？</span></div>
    <div class="cc-cols">${errCols}</div>
    ${ccXAxis()}
    <div class="cc-note">已按课长折算，长课短课可以直接比。注意：错误密度高的课（${[...lessons].sort((a,b)=>b.metrics.errors_per_10min-a.metrics.errors_per_10min).slice(0,2).map(d=>'L'+d.lesson).join('、')}）都是独立朗读任务特别多的课——数字高更多说明"这节课对解码要求高"，不代表能力退步。</div>
  </div>

  <div class="card">
    <div class="cc-head"><span class="cc-title">④ 书写耗时：每课最慢的一项任务</span><span class="cc-q">条越短完成越快。注意各课任务难度不同，看大方向即可</span></div>
    <div style="margin-top:10px">${wHtml}</div>
    <div class="cc-legend" style="margin-top:12px">
      <span><span class="cc-dot" style="background:var(--green)"></span>快</span>
      <span><span class="cc-dot" style="background:var(--amber)"></span>中等</span>
      <span><span class="cc-dot" style="background:var(--red)"></span>慢</span>
    </div>
    <div class="cc-note">单词级书写已明显提速（L9 复数名词每题仅 7–12 秒）；目前最慢的是"写完整句子"类任务（L6/L8），是下阶段重点。</div>
  </div>`;
}

// ── PROGRESS PAGE ─────────────────────────────────
function buildProgressPage() {
  const n = lessons.length;

  // collect shared skill names across lessons (by position for simplicity)
  // For trend: find skills that appear in both lessons by name similarity
  const allSkillNames = [...new Set(lessons.flatMap(d=>d.skills.map(s=>s.name)))];

  // trend rows for skill chart
  const skillTrends = allSkillNames.map(name => {
    const vals = lessons.map(d => { const s=d.skills.find(x=>x.name===name); return s?s.pct:null; });
    return {name, vals};
  }).filter(s=>s.vals.filter(v=>v!==null).length>1);

  // ── Vocabulary accumulation ──────────────────────────────
  const colorLabels = {
    '#7F77DD': '绘本叙事',
    '#1a9068': '拼读·元音',
    '#d4840a': '视觉词·语法',
    '#378ADD': '句型·绘本',
    '#D85A30': '主题词汇'
  };
  const allWordsMap = {};   // word.lower → {lessonNums: Set, color}
  const colorGroupsMap = {}; // color → {color, label, wordSet}
  const colorOrder = ['#1a9068','#7F77DD','#d4840a','#378ADD','#D85A30'];
  lessons.forEach(d => {
    d.modules.forEach(mod => {
      const c = mod.color;
      if (!colorGroupsMap[c]) colorGroupsMap[c] = {color:c, label:colorLabels[c]||mod.name, words:new Set()};
      (mod.vocab||[]).forEach(w => {
        colorGroupsMap[c].words.add(w);
        const key = w.toLowerCase();
        if (!allWordsMap[key]) allWordsMap[key] = {lessonNums: new Set(), color: c};
        allWordsMap[key].lessonNums.add(d.lesson);
      });
    });
  });
  const repeatWordSet = new Set(Object.entries(allWordsMap).filter(([,v])=>v.lessonNums.size>1).map(([w])=>w));
  const totalWordCount = Object.keys(allWordsMap).length;
  const repeatCount = repeatWordSet.size;
  const vocabGroupsHtml = colorOrder
    .filter(c => colorGroupsMap[c])
    .map(c => {
      const g = colorGroupsMap[c];
      const wordArr = [...g.words];
      const chips = wordArr.map(w=>`<span class="vocab-chip${repeatWordSet.has(w.toLowerCase())?' repeat':''}">${w}</span>`).join('');
      return `<div class="vocab-group"><div class="vocab-group-title"><span class="vocab-group-dot" style="background:${g.color}"></span>${g.label}<span style="margin-left:4px;color:var(--text3);font-weight:400;font-size:10px">${wordArr.length}词</span></div><div class="vocab-group-words">${chips}</div></div>`;
    }).join('');

  // ── Sentence patterns ──────────────────────────────────
  // Collect all patterns, tagged with lesson number; dedupe by pattern text
  const patternCatColors = {
    '动词变化':'#2e7d32','情态动词':'#1565c0','序数表达':'#880e4f',
    '信息类句型':'#6a1b9a','WH-疑问句':'#f57f17','描述句型':'#006064',
    '基本句型':'#283593','主谓宾':'#bf360c','代词替换':'#004d40'
  };
  // Group by category, collecting all lesson occurrences
  const patternsByCat = {}; // category → [{pattern,example,lessonNums:[]}]
  lessons.forEach(d => {
    (d.sentence_patterns||[]).forEach(p => {
      if (!patternsByCat[p.category]) patternsByCat[p.category] = [];
      const existing = patternsByCat[p.category].find(x => x.pattern === p.pattern);
      if (existing) { existing.lessonNums.push(d.lesson); }
      else patternsByCat[p.category].push({...p, lessonNums:[d.lesson]});
    });
  });
  const totalPatterns = Object.values(patternsByCat).reduce((s,a)=>s+a.length,0);
  const patternsHtml = Object.entries(patternsByCat).map(([cat, pats])=>{
    const color = patternCatColors[cat] || 'var(--text2)';
    const bg = color.replace(/^#/,'');
    const rows = pats.map(p => {
      const tags = p.lessonNums.map(l=>`<span class="pattern-lesson-tag">L${l}</span>`).join('');
      return `<div class="pattern-row" style="justify-content:space-between">
        <div class="pattern-body" style="flex:1">
          <div class="pattern-text">${p.pattern}</div>
          <div class="pattern-example">${p.example}</div>
        </div>
        <div style="display:flex;gap:3px;margin-left:8px;align-self:flex-start;margin-top:2px">${tags}</div>
      </div>`;
    }).join('');
    return `<div style="margin-bottom:12px">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">
        <span style="width:8px;height:8px;border-radius:50%;background:${color};flex-shrink:0;display:inline-block"></span>
        <span style="font-size:11px;font-weight:600;color:${color}">${cat}</span>
        <span style="font-size:10px;color:var(--text3)">${pats.length}个句型</span>
      </div>
      <div class="pattern-list">${rows}</div>
    </div>`;
  }).join('');

  // ── Error type analysis ────────────────────────────────
  const promptLabels = {
    'modeled':        '老师示范',
    'modeled-repeat': '多次示范',
    'direct':         '直接告知',
    'hint':           '暗示提示',
    'two-choice':     '二选一',
    'explanation':    '概念解释'
  };
  const errTypeCounts = {};
  const errTypeExamples = {};
  lessons.forEach(d => {
    (d.metrics.error_corrections||[]).forEach(e => {
      const t = e.prompt_type;
      errTypeCounts[t] = (errTypeCounts[t]||0) + 1;
      if (!errTypeExamples[t]) errTypeExamples[t] = e.error;
    });
  });
  const errTotal = Object.values(errTypeCounts).reduce((a,b)=>a+b,0);
  const errSorted = Object.entries(errTypeCounts).sort((a,b)=>b[1]-a[1]);
  const errBarsHtml = errSorted.map(([type, cnt])=>{
    const pct = Math.round(cnt/errTotal*100);
    const label = promptLabels[type]||type;
    const ex = errTypeExamples[type]||'';
    return `<div class="err-bar-row">
      <div style="width:76px;flex-shrink:0;text-align:right">
        <div style="font-size:11px;color:var(--text)">${label}</div>
        <div class="err-type-desc">${cnt}次 · ${pct}%</div>
      </div>
      <div class="err-bar-track"><div class="err-bar-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');

  let html = `
  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.5rem">
    <div>
      <h2 style="font-size:22px;font-weight:500;margin-bottom:4px">学习进展总览</h2>
      <p style="font-size:13px;color:var(--text2)">基于第 1–${n} 课时间码量化数据 · 已记录 ${n} / ${total} 课次</p>
    </div>
    <button class="capture-btn" onclick="captureCurrentPage(this)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg> 保存截图</button>
  </div>

  <div class="stitle">课次记录进度</div>
  <div class="card" style="padding:1rem 1.25rem .9rem">
    <div class="prog-dots">
      ${Array(total).fill(0).map((_,i)=>`<div class="pd" style="background:${i<n?'var(--green)':'var(--surface2)'}"></div>`).join('')}
    </div>
    <div style="font-size:11px;color:var(--text3);margin-top:5px">
      ${lessons.map(d=>`第 ${d.lesson} 课 ${d.date}`).join(' · ')} · 后续课次上传后自动更新
    </div>
  </div>

  <div class="stitle">核心指标对比</div>
  <div class="metrics">
    <div class="mc">
      <div class="mc-label">跟读延迟分布（最新课）</div>
      <div class="mc-val" style="color:var(--green);font-size:16px;line-height:1.4;padding-top:3px">${latDist(lessons[n-1].metrics.repeat_latency)}</div>
      <div class="mc-sub">${lessons.map(d=>`L${d.lesson}: ${d.metrics.repeat_latency.mean}s${d.metrics.repeat_latency.low_confidence?'*':''}`).join(' → ')}<br><span style="color:var(--text3)">* n&lt;8 低置信 · 时间码精度1s，均值差异多属噪声</span></div>
    </div>
    <div class="mc">
      <div class="mc-label">任务外停滞 (≥30s)</div>
      <div class="mc-val" style="color:${lessons[n-1].metrics.gaps_offtask_count>0?'var(--red)':'var(--green)'}">${lessons[n-1].metrics.gaps_offtask_count}</div>
      <div class="mc-sub">${lessons.map(d=>`L${d.lesson}: ${d.metrics.gaps_offtask_count}次`).join(' → ')}<br><span style="color:var(--text3)">任务内停滞属书写/操作耗时，不计入此项</span></div>
    </div>
    <div class="mc">
      <div class="mc-label">朗读错误率（次/10分钟）</div>
      <div class="mc-val" style="color:var(--green)">${lessons[n-1].metrics.errors_per_10min}</div>
      <div class="mc-sub">${lessons.map(d=>`L${d.lesson}: ${d.metrics.errors_per_10min}`).join(' → ')}<br><span style="color:var(--text3)">按课长归一化，消除课时差异</span></div>
    </div>
    <div class="mc">
      <div class="mc-label">纠错接受速度</div>
      <div class="mc-val" style="color:var(--text)">1–3<span style="font-size:13px;font-weight:400">s</span></div>
      <div class="mc-sub">两课一致<br><span style="color:var(--text3)">→ 提示后快速改正</span></div>
    </div>
  </div>

  ${buildTrendCharts()}

  <div class="stitle">技能掌握度趋势</div>
  <div class="card">
    <div style="display:flex;gap:14px;margin-bottom:12px;font-size:11px;color:var(--text3)">
      ${lessons.map((d,i)=>`<div style="display:flex;align-items:center;gap:5px"><div style="width:20px;height:5px;border-radius:3px;background:var(--green);opacity:${0.4+i*0.6}"></div>第${d.lesson}课</div>`).join('')}
      <div style="display:flex;align-items:center;gap:5px"><div style="width:20px;height:5px;border-radius:3px;background:var(--amber)"></div>待加强</div>
    </div>
    ${skillTrends.map(s=>{
      const last=s.vals.filter(v=>v!==null).slice(-1)[0];
      return `<div class="stb-row">
        <div class="stb-top"><span class="stb-name">${s.name}</span><span class="stb-vals">${s.vals.map((v,i)=>v!==null?`L${i+1}: ${v}%`:'').filter(Boolean).join(' ')}</span></div>
        ${s.vals.map((v,i)=>v!==null?`<div class="stb-b" style="width:${v}%;background:${v>=75?'var(--green)':'var(--amber)'};opacity:${0.4+i*(0.6/Math.max(1,n-1))};margin-bottom:3px"></div>`:'').join('')}
      </div>`;
    }).join('')}
  </div>

  <div class="stitle">词汇积累</div>
  <div class="card">
    <div style="display:flex;align-items:center;gap:18px;margin-bottom:14px;flex-wrap:wrap">
      <span style="font-size:13px;color:var(--text2)">已累积 <strong style="font-size:16px;color:var(--text);font-weight:600">${totalWordCount}</strong> 个单词</span>
      <span style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text3)"><span class="vocab-chip repeat" style="pointer-events:none">word</span> 绿色 = 跨课复现（${repeatCount} 词）</span>
    </div>
    <div class="vocab-section-grid">${vocabGroupsHtml}</div>
  </div>

  <div class="stitle">句型积累</div>
  <div class="card">
    <div style="font-size:12px;color:var(--text3);margin-bottom:14px">共 <strong style="color:var(--text)">${totalPatterns}</strong> 个句型 · 标签显示首次出现课次 · 同一句型多课出现则展示全部</div>
    ${patternsHtml}
  </div>

  <div class="stitle">纠错分析</div>
  <div class="g2">
    <div class="card no-mb">
      <div style="font-size:12px;color:var(--text3);margin-bottom:14px">三课共 <strong style="color:var(--text)">${errTotal}</strong> 次纠错 · 按提示方式分类</div>
      ${errBarsHtml}
    </div>
    <div class="card no-mb">
      <div class="stitle" style="margin-bottom:8px;font-size:11px">提示方式说明</div>
      <div style="display:flex;flex-direction:column;gap:6px;font-size:12px">
        <div><strong>老师示范</strong> — 老师说出正确答案，Nova 跟读（最常见）</div>
        <div><strong>多次示范</strong> — 首次示范后仍出错，需再次示范</div>
        <div><strong>直接告知</strong> — 直接给出正确词形，不作示范</div>
        <div><strong>概念解释</strong> — 解释语法/音韵规则后纠正</div>
        <div><strong>二选一</strong> — 给出两个选项让 Nova 选择正确答案</div>
        <div><strong>暗示提示</strong> — 给出线索引导 Nova 自行找到答案</div>
      </div>
    </div>
  </div>

  ${(()=>{
    const sa = lessons[n-1].stage_assessment || {};
    const mastered = sa.mastered || [];
    const needs = sa.needs_work || [];
    const summary = sa.summary || '';
    if (!mastered.length && !needs.length && !summary) return '';
    return `
  <div class="g2">
    ${mastered.length ? `<div class="card no-mb">
      <div class="stitle" style="margin-bottom:10px">已稳定掌握（跨${n}课）</div>
      <div style="display:flex;flex-direction:column;gap:7px;font-size:13px">
        ${mastered.map(i=>`<div style="display:flex;gap:8px"><span style="color:var(--green);flex-shrink:0">✓</span><div><strong>${i.title}</strong><br><span style="font-size:12px;color:var(--text2)">${i.detail}</span></div></div>`).join('')}
      </div>
    </div>` : ''}
    ${needs.length ? `<div class="card no-mb">
      <div class="stitle" style="margin-bottom:10px">持续待加强（跨${n}课）</div>
      <div style="display:flex;flex-direction:column;gap:7px;font-size:13px">
        ${needs.map(i=>`<div style="display:flex;gap:8px"><span style="color:var(--amber);flex-shrink:0">△</span><div><strong>${i.title}</strong><br><span style="font-size:12px;color:var(--text2)">${i.detail}</span></div></div>`).join('')}
      </div>
    </div>` : ''}
  </div>

  ${summary ? `<div class="stitle">阶段综合评估</div>
  <div class="card"><div class="summary-text">${summary}</div></div>` : ''}`;
  })()}`;
  return html;
}

// ── RENDER ────────────────────────────────────────
// ── CALENDAR ──────────────────────────────────────────
function buildCalendarPage() {
  const lessonMap = {};
  lessons.forEach(d => { lessonMap[d.date] = d.lesson; });

  const dates = lessons.map(d => d.date).sort();
  const first = new Date(dates[0]);
  const today = new Date();
  const todayStr = today.toISOString().slice(0,10);

  let cy = first.getFullYear(), cm = first.getMonth();
  const ey = today.getFullYear(), em = today.getMonth();
  const months = [];
  while (cy < ey || (cy === ey && cm <= em)) {
    months.push({year: cy, month: cm});
    if (++cm > 11) { cm = 0; cy++; }
  }

  const WDAYS = ['一','二','三','四','五','六','日'];
  const MNAMES = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

  function pad2(n){ return String(n).padStart(2,'0'); }

  function renderMonth(year, month) {
    const firstWday = (new Date(year, month, 1).getDay() + 6) % 7; // Mon=0
    const days = new Date(year, month + 1, 0).getDate();
    const header = WDAYS.map(w=>`<div class="cal-wday">${w}</div>`).join('');
    let cells = '';
    for (let i = 0; i < firstWday; i++) cells += '<div class="cal-day"></div>';
    for (let d = 1; d <= days; d++) {
      const ds = `${year}-${pad2(month+1)}-${pad2(d)}`;
      const ln = lessonMap[ds];
      const cls = ['cal-day', ln!==undefined?'cal-lesson':'', ds===todayStr?'cal-today':''].filter(Boolean).join(' ');
      const badge = ln!==undefined ? `<span class="cal-badge" onclick="showLessonFromCalendar(${ln})">L${ln}</span>` : '';
      cells += `<div class="${cls}"><span class="cal-num">${d}</span>${badge}</div>`;
    }
    return `<div class="cal-month"><div class="cal-month-title">${year}年 ${MNAMES[month]}</div><div class="cal-grid">${header}${cells}</div></div>`;
  }

  const totalMin = lessons.reduce((s,d)=>s+(d.duration_min||0),0);
  return `
    <div class="cal-toprow">
      <div class="stitle">课次日历</div>
      <div class="cal-summary">共 <strong>${lessons.length}</strong> 节课 · 累计 <strong>${totalMin}</strong> 分钟</div>
    </div>
    <div class="cal-months">${months.map(({year,month})=>renderMonth(year,month)).join('')}</div>
    <div class="cal-legend"><span class="cal-legend-dot"></span><span>上课日（点击跳转课次详情）</span></div>`;
}

function showLessonFromCalendar(n) {
  const navBtns = document.querySelectorAll('.nav-tab');
  showPage('lessons', navBtns[1]);
  const lsBtn = [...document.querySelectorAll('.ls-btn')].find(b=>b.textContent==='L'+n);
  showLesson(n, lsBtn||null);
}

function renderAll() {
  // progress page
  $('page-progress').innerHTML = buildProgressPage();

  // lesson switcher buttons
  const sw = $('lesson-switcher');
  sw.innerHTML = lessons.map(d=>`<button class="ls-btn${d.lesson===1?' active':''}" onclick="showLesson(${d.lesson},this)">L${d.lesson}</button>`).join('');

  // lesson pages container
  const lp = $('page-lessons');
  lp.innerHTML = lessons.map((d,i)=>`<div id="lesson-${d.lesson}" class="lesson-slot" style="${i>0?'display:none':''}">${buildLessonPage(d)}</div>`).join('');

  // calendar page
  $('page-calendar').innerHTML = buildCalendarPage();

  // footer
  $('footer').textContent = `数据来源：${lessons.map(d=>d.source_file).join(' · ')} · 授课教师 Ashley · 学生 Nova · 时间码采样各课 n≥11`;
}

// ── NAV ───────────────────────────────────────────
function showPage(p, btn) {
  document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(e=>e.classList.remove('active'));
  $('page-'+p).classList.add('active');
  if(btn) btn.classList.add('active');
  $('lesson-switcher').style.display = p==='lessons'?'flex':'none';
}

function showLesson(n, btn) {
  document.querySelectorAll('.lesson-slot').forEach(e=>e.style.display='none');
  document.querySelectorAll('.ls-btn').forEach(e=>e.classList.remove('active'));
  $('lesson-'+n).style.display='block';
  if(btn) btn.classList.add('active');
}

// ── SCREENSHOT ────────────────────────────────────
async function captureCurrentPage(btn) {
  const page = document.querySelector('.page.active');
  const btns = [...page.querySelectorAll('.capture-btn')];
  const origHTML = btn.innerHTML;
  btn.innerHTML = '生成中…';
  btns.forEach(b => b.disabled = true);
  await new Promise(r => setTimeout(r, 40));
  btns.forEach(b => b.style.visibility = 'hidden');
  try {
    const canvas = await html2canvas(page, {
      height: page.scrollHeight,
      windowHeight: page.scrollHeight,
      backgroundColor: '#f4f2ee',
      useCORS: true,
      allowTaint: true,
      scale: Math.min(window.devicePixelRatio || 1, 2),
      logging: false,
    });
    const label = (document.querySelector('.nav-tab.active')?.textContent.trim() || 'nova').replace(/\s+/g,'-');
    const a = document.createElement('a');
    a.download = `nova-${label}-${new Date().toISOString().slice(0,10)}.png`;
    a.href = canvas.toDataURL('image/png');
    a.click();
  } catch(e) {
    alert('截图失败：' + e.message);
  } finally {
    btns.forEach(b => { b.style.visibility = ''; b.disabled = false; });
    btn.innerHTML = origHTML;
  }
}

renderAll();
</script>
