<script>
// ── helpers ──────────────────────────────────────
const $ = id => document.getElementById(id);
const el = (tag, cls, html='') => { const e=document.createElement(tag); if(cls)e.className=cls; if(html)e.innerHTML=html; return e; };
function scoreBlocks(score){
  const full=Math.floor(score), half=(score%1>=0.4&&score%1<0.9)?1:0, empty=5-full-half;
  return Array(full).fill('<div class="db" style="background:var(--green)"></div>').join('')+
    (half?'<div class="db" style="background:#9FE1CB"></div>':'')+
    Array(empty).fill('<div class="db" style="background:var(--surface2);border:1px solid var(--border)"></div>').join('');
}
function ratingPill(r){
  const m={fast:'pill-fast',mid:'pill-mid',slow:'pill-slow','alert':'pill-slow'};
  const l={fast:'流畅',mid:'中等',slow:'困难','alert':'⚠'};
  return `<span class="pill ${m[r]||'pill-ok'}">${l[r]||r}</span>`;
}
function barColor(s){return s>=75?'var(--green)':'var(--amber)';}
function tbarColor(r){return r==='fast'?'var(--green)':r==='slow'?'var(--red)':'var(--amber)';}

// ── PROGRESS PAGE ─────────────────────────────────
function buildProgressPage() {
  const n = lessons.length;

  // collect shared skill names across lessons (by position for simplicity)
  // For trend: find skills that appear in both lessons by name similarity
  const allSkillNames = [...new Set(lessons.flatMap(d=>d.skills.map(s=>s.name)))];

  // trend rows for skill chart
  const skillTrends = allSkillNames.map(name => {
    const vals = lessons.map(d => { const s=d.skills.find(x=>x.name===name); return s?s.pct:null; });
    return {name, vals};
  }).filter(s=>s.vals.filter(v=>v!==null).length>1);

  // ── Vocabulary accumulation ──────────────────────────────
  const colorLabels = {
    '#7F77DD': '绘本叙事',
    '#1a9068': '拼读·元音',
    '#d4840a': '视觉词·语法',
    '#378ADD': '句型·绘本',
    '#D85A30': '主题词汇'
  };
  const allWordsMap = {};   // word.lower → {lessonNums: Set, color}
  const colorGroupsMap = {}; // color → {color, label, wordSet}
  const colorOrder = ['#1a9068','#7F77DD','#d4840a','#378ADD','#D85A30'];
  lessons.forEach(d => {
    d.modules.forEach(mod => {
      const c = mod.color;
      if (!colorGroupsMap[c]) colorGroupsMap[c] = {color:c, label:colorLabels[c]||mod.name, words:new Set()};
      (mod.vocab||[]).forEach(w => {
        colorGroupsMap[c].words.add(w);
        const key = w.toLowerCase();
        if (!allWordsMap[key]) allWordsMap[key] = {lessonNums: new Set(), color: c};
        allWordsMap[key].lessonNums.add(d.lesson);
      });
    });
  });
  const repeatWordSet = new Set(Object.entries(allWordsMap).filter(([,v])=>v.lessonNums.size>1).map(([w])=>w));
  const totalWordCount = Object.keys(allWordsMap).length;
  const repeatCount = repeatWordSet.size;
  const vocabGroupsHtml = colorOrder
    .filter(c => colorGroupsMap[c])
    .map(c => {
      const g = colorGroupsMap[c];
      const wordArr = [...g.words];
      const chips = wordArr.map(w=>`<span class="vocab-chip${repeatWordSet.has(w.toLowerCase())?' repeat':''}">${w}</span>`).join('');
      return `<div class="vocab-group"><div class="vocab-group-title"><span class="vocab-group-dot" style="background:${g.color}"></span>${g.label}<span style="margin-left:4px;color:var(--text3);font-weight:400;font-size:10px">${wordArr.length}词</span></div><div class="vocab-group-words">${chips}</div></div>`;
    }).join('');

  // ── Sentence patterns ──────────────────────────────────
  // Collect all patterns, tagged with lesson number; dedupe by pattern text
  const patternCatColors = {
    '动词变化':'#2e7d32','情态动词':'#1565c0','序数表达':'#880e4f',
    '信息类句型':'#6a1b9a','WH-疑问句':'#f57f17','描述句型':'#006064',
    '基本句型':'#283593','主谓宾':'#bf360c','代词替换':'#004d40'
  };
  // Group by category, collecting all lesson occurrences
  const patternsByCat = {}; // category → [{pattern,example,lessonNums:[]}]
  lessons.forEach(d => {
    (d.sentence_patterns||[]).forEach(p => {
      if (!patternsByCat[p.category]) patternsByCat[p.category] = [];
      const existing = patternsByCat[p.category].find(x => x.pattern === p.pattern);
      if (existing) { existing.lessonNums.push(d.lesson); }
      else patternsByCat[p.category].push({...p, lessonNums:[d.lesson]});
    });
  });
  const totalPatterns = Object.values(patternsByCat).reduce((s,a)=>s+a.length,0);
  const patternsHtml = Object.entries(patternsByCat).map(([cat, pats])=>{
    const color = patternCatColors[cat] || 'var(--text2)';
    const bg = color.replace(/^#/,'');
    const rows = pats.map(p => {
      const tags = p.lessonNums.map(l=>`<span class="pattern-lesson-tag">L${l}</span>`).join('');
      return `<div class="pattern-row" style="justify-content:space-between">
        <div class="pattern-body" style="flex:1">
          <div class="pattern-text">${p.pattern}</div>
          <div class="pattern-example">${p.example}</div>
        </div>
        <div style="display:flex;gap:3px;margin-left:8px;align-self:flex-start;margin-top:2px">${tags}</div>
      </div>`;
    }).join('');
    return `<div style="margin-bottom:12px">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">
        <span style="width:8px;height:8px;border-radius:50%;background:${color};flex-shrink:0;display:inline-block"></span>
        <span style="font-size:11px;font-weight:600;color:${color}">${cat}</span>
        <span style="font-size:10px;color:var(--text3)">${pats.length}个句型</span>
      </div>
      <div class="pattern-list">${rows}</div>
    </div>`;
  }).join('');

  // ── Error type analysis ────────────────────────────────
  const promptLabels = {
    'modeled':        '老师示范',
    'modeled-repeat': '多次示范',
    'direct':         '直接告知',
    'hint':           '暗示提示',
    'two-choice':     '二选一',
    'explanation':    '概念解释'
  };
  const errTypeCounts = {};
  const errTypeExamples = {};
  lessons.forEach(d => {
    (d.metrics.error_corrections||[]).forEach(e => {
      const t = e.prompt_type;
      errTypeCounts[t] = (errTypeCounts[t]||0) + 1;
      if (!errTypeExamples[t]) errTypeExamples[t] = e.error;
    });
  });
  const errTotal = Object.values(errTypeCounts).reduce((a,b)=>a+b,0);
  const errSorted = Object.entries(errTypeCounts).sort((a,b)=>b[1]-a[1]);
  const errBarsHtml = errSorted.map(([type, cnt])=>{
    const pct = Math.round(cnt/errTotal*100);
    const label = promptLabels[type]||type;
    const ex = errTypeExamples[type]||'';
    return `<div class="err-bar-row">
      <div style="width:76px;flex-shrink:0;text-align:right">
        <div style="font-size:11px;color:var(--text)">${label}</div>
        <div class="err-type-desc">${cnt}次 · ${pct}%</div>
      </div>
      <div class="err-bar-track"><div class="err-bar-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');

  let html = `
  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.5rem">
    <div>
      <h2 style="font-size:22px;font-weight:500;margin-bottom:4px">学习进展总览</h2>
      <p style="font-size:13px;color:var(--text2)">基于第 1–${n} 课时间码量化数据 · 已记录 ${n} / ${total} 课次</p>
    </div>
    <button class="capture-btn" onclick="captureCurrentPage(this)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg> 保存截图</button>
  </div>

  <div class="stitle">课次记录进度</div>
  <div class="card" style="padding:1rem 1.25rem .9rem">
    <div class="prog-dots">
      ${Array(total).fill(0).map((_,i)=>`<div class="pd" style="background:${i<n?'var(--green)':'var(--surface2)'}"></div>`).join('')}
    </div>
    <div style="font-size:11px;color:var(--text3);margin-top:5px">
      ${lessons.map(d=>`第 ${d.lesson} 课 ${d.date}`).join(' · ')} · 后续课次上传后自动更新
    </div>
  </div>

  <div class="stitle">核心指标对比</div>
  <div class="metrics">
    <div class="mc">
      <div class="mc-label">跟读平均延迟</div>
      <div class="mc-val" style="color:var(--green)">${lessons[n-1].metrics.repeat_latency.mean}<span style="font-size:13px;font-weight:400">s</span></div>
      <div class="mc-sub">${lessons.map(d=>`L${d.lesson}: ${d.metrics.repeat_latency.mean}s`).join(' → ')}<br><span style="color:var(--green)">→ 持平稳定</span></div>
    </div>
    <div class="mc">
      <div class="mc-label">≥30s 注意力停滞</div>
      <div class="mc-val" style="color:var(--red)">${lessons[n-1].metrics.gaps_30s_count}</div>
      <div class="mc-sub">${lessons.map(d=>`L${d.lesson}: ${d.metrics.gaps_30s_count}次`).join(' → ')}<br><span style="color:${lessons[n-1].metrics.gaps_30s_count>lessons[0].metrics.gaps_30s_count?'var(--red)':'var(--green)'}">
        ${lessons[n-1].metrics.gaps_30s_count>lessons[0].metrics.gaps_30s_count?'↑ 增加':'↓ 减少或持平'}</span></div>
    </div>
    <div class="mc">
      <div class="mc-label">朗读错误次数</div>
      <div class="mc-val" style="color:var(--green)">${lessons[n-1].metrics.errors_count}</div>
      <div class="mc-sub">${lessons.map(d=>`L${d.lesson}: ${d.metrics.errors_count}次`).join(' → ')}<br><span style="color:${lessons[n-1].metrics.errors_count<lessons[0].metrics.errors_count?'var(--green)':'var(--amber)'}">
        ${lessons[n-1].metrics.errors_count<lessons[0].metrics.errors_count?'↓ 略减':'→ 持平'}</span></div>
    </div>
    <div class="mc">
      <div class="mc-label">纠错接受速度</div>
      <div class="mc-val" style="color:var(--text)">1–3<span style="font-size:13px;font-weight:400">s</span></div>
      <div class="mc-sub">两课一致<br><span style="color:var(--text3)">→ 提示后快速改正</span></div>
    </div>
  </div>

  <div class="stitle">跨课次详细对比</div>
  <div class="card">
    <table class="trend-tbl">
      <tr>
        <th style="width:160px">指标</th>
        ${lessons.map(d=>`<th>第 ${d.lesson} 课<br><span class="t-note">${d.date} · ${d.duration_min}min</span></th>`).join('')}
        <th>趋势</th><th>说明</th>
      </tr>
      <tr>
        <td>跟读平均延迟</td>
        ${lessons.map(d=>`<td>${d.metrics.repeat_latency.mean}s（n=${d.metrics.repeat_latency.n}）</td>`).join('')}
        <td><span class="t-eq">→ 持平</span></td>
        <td class="t-note">口语跟读通道稳健</td>
      </tr>
      <tr>
        <td>≥30s 注意力停滞</td>
        ${lessons.map(d=>`<td>${d.metrics.gaps_30s_count} 次</td>`).join('')}
        <td><span class="t-dn">↑ 增加</span></td>
        <td class="t-note">L2含技术原因（鼠标）</td>
      </tr>
      <tr>
        <td>朗读错误次数</td>
        ${lessons.map(d=>`<td>${d.metrics.errors_count} 次</td>`).join('')}
        <td><span class="t-up">↓ 略减</span></td>
        <td class="t-note">L2以语法/近音词错误为主</td>
      </tr>
      <tr>
        <td>书写耗时（代表词）</td>
        ${lessons.map(d=>{const w=d.metrics.writing_tasks.find(t=>t.rating==='slow')||d.metrics.writing_tasks[0];return `<td>${w.name}=${w.seconds}s</td>`;}).join('')}
        <td><span class="t-up">↓ 显著</span></td>
        <td class="t-note">L2改跟读模式，可比性有限</td>
      </tr>
    </table>
  </div>

  <div class="stitle">技能掌握度趋势</div>
  <div class="card">
    <div style="display:flex;gap:14px;margin-bottom:12px;font-size:11px;color:var(--text3)">
      ${lessons.map((d,i)=>`<div style="display:flex;align-items:center;gap:5px"><div style="width:20px;height:5px;border-radius:3px;background:var(--green);opacity:${0.4+i*0.6}"></div>第${d.lesson}课</div>`).join('')}
      <div style="display:flex;align-items:center;gap:5px"><div style="width:20px;height:5px;border-radius:3px;background:var(--amber)"></div>待加强</div>
    </div>
    ${skillTrends.map(s=>{
      const last=s.vals.filter(v=>v!==null).slice(-1)[0];
      return `<div class="stb-row">
        <div class="stb-top"><span class="stb-name">${s.name}</span><span class="stb-vals">${s.vals.map((v,i)=>v!==null?`L${i+1}: ${v}%`:'').filter(Boolean).join(' ')}</span></div>
        ${s.vals.map((v,i)=>v!==null?`<div class="stb-b" style="width:${v}%;background:${v>=75?'var(--green)':'var(--amber)'};opacity:${0.4+i*(0.6/Math.max(1,n-1))};margin-bottom:3px"></div>`:'').join('')}
      </div>`;
    }).join('')}
  </div>

  <div class="stitle">词汇积累</div>
  <div class="card">
    <div style="display:flex;align-items:center;gap:18px;margin-bottom:14px;flex-wrap:wrap">
      <span style="font-size:13px;color:var(--text2)">已累积 <strong style="font-size:16px;color:var(--text);font-weight:600">${totalWordCount}</strong> 个单词</span>
      <span style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text3)"><span class="vocab-chip repeat" style="pointer-events:none">word</span> 绿色 = 跨课复现（${repeatCount} 词）</span>
    </div>
    <div class="vocab-section-grid">${vocabGroupsHtml}</div>
  </div>

  <div class="stitle">句型积累</div>
  <div class="card">
    <div style="font-size:12px;color:var(--text3);margin-bottom:14px">共 <strong style="color:var(--text)">${totalPatterns}</strong> 个句型 · 标签显示首次出现课次 · 同一句型多课出现则展示全部</div>
    ${patternsHtml}
  </div>

  <div class="stitle">纠错分析</div>
  <div class="g2">
    <div class="card no-mb">
      <div style="font-size:12px;color:var(--text3);margin-bottom:14px">三课共 <strong style="color:var(--text)">${errTotal}</strong> 次纠错 · 按提示方式分类</div>
      ${errBarsHtml}
    </div>
    <div class="card no-mb">
      <div class="stitle" style="margin-bottom:8px;font-size:11px">提示方式说明</div>
      <div style="display:flex;flex-direction:column;gap:6px;font-size:12px">
        <div><strong>老师示范</strong> — 老师说出正确答案，Nova 跟读（最常见）</div>
        <div><strong>多次示范</strong> — 首次示范后仍出错，需再次示范</div>
        <div><strong>直接告知</strong> — 直接给出正确词形，不作示范</div>
        <div><strong>概念解释</strong> — 解释语法/音韵规则后纠正</div>
        <div><strong>二选一</strong> — 给出两个选项让 Nova 选择正确答案</div>
        <div><strong>暗示提示</strong> — 给出线索引导 Nova 自行找到答案</div>
      </div>
    </div>
  </div>

  ${(()=>{
    const sa = lessons[n-1].stage_assessment || {};
    const mastered = sa.mastered || [];
    const needs = sa.needs_work || [];
    const summary = sa.summary || '';
    if (!mastered.length && !needs.length && !summary) return '';
    return `
  <div class="g2">
    ${mastered.length ? `<div class="card no-mb">
      <div class="stitle" style="margin-bottom:10px">已稳定掌握（跨${n}课）</div>
      <div style="display:flex;flex-direction:column;gap:7px;font-size:13px">
        ${mastered.map(i=>`<div style="display:flex;gap:8px"><span style="color:var(--green);flex-shrink:0">✓</span><div><strong>${i.title}</strong><br><span style="font-size:12px;color:var(--text2)">${i.detail}</span></div></div>`).join('')}
      </div>
    </div>` : ''}
    ${needs.length ? `<div class="card no-mb">
      <div class="stitle" style="margin-bottom:10px">持续待加强（跨${n}课）</div>
      <div style="display:flex;flex-direction:column;gap:7px;font-size:13px">
        ${needs.map(i=>`<div style="display:flex;gap:8px"><span style="color:var(--amber);flex-shrink:0">△</span><div><strong>${i.title}</strong><br><span style="font-size:12px;color:var(--text2)">${i.detail}</span></div></div>`).join('')}
      </div>
    </div>` : ''}
  </div>

  ${summary ? `<div class="stitle">阶段综合评估</div>
  <div class="card"><div class="summary-text">${summary}</div></div>` : ''}`;
  })()}`;
  return html;
}

// ── RENDER ────────────────────────────────────────
function renderAll() {
  // progress page
  $('page-progress').innerHTML = buildProgressPage();

  // lesson switcher buttons
  const sw = $('lesson-switcher');
  sw.innerHTML = lessons.map(d=>`<button class="ls-btn${d.lesson===1?' active':''}" onclick="showLesson(${d.lesson},this)">L${d.lesson}</button>`).join('');

  // lesson pages container
  const lp = $('page-lessons');
  lp.innerHTML = lessons.map((d,i)=>`<div id="lesson-${d.lesson}" class="lesson-slot" style="${i>0?'display:none':''}">${buildLessonPage(d)}</div>`).join('');

  // footer
  $('footer').textContent = `数据来源：${lessons.map(d=>d.source_file).join(' · ')} · 授课教师 Ashley · 学生 Nova · 时间码采样各课 n≥11`;
}

// ── NAV ───────────────────────────────────────────
function showPage(p, btn) {
  document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(e=>e.classList.remove('active'));
  $('page-'+p).classList.add('active');
  if(btn) btn.classList.add('active');
  $('lesson-switcher').style.display = p==='lessons'?'flex':'none';
}

function showLesson(n, btn) {
  document.querySelectorAll('.lesson-slot').forEach(e=>e.style.display='none');
  document.querySelectorAll('.ls-btn').forEach(e=>e.classList.remove('active'));
  $('lesson-'+n).style.display='block';
  if(btn) btn.classList.add('active');
}

// ── SCREENSHOT ────────────────────────────────────
async function captureCurrentPage(btn) {
  const page = document.querySelector('.page.active');
  const btns = [...page.querySelectorAll('.capture-btn')];
  const origHTML = btn.innerHTML;
  btn.innerHTML = '生成中…';
  btns.forEach(b => b.disabled = true);
  await new Promise(r => setTimeout(r, 40));
  btns.forEach(b => b.style.visibility = 'hidden');
  try {
    const canvas = await html2canvas(page, {
      height: page.scrollHeight,
      windowHeight: page.scrollHeight,
      backgroundColor: '#f4f2ee',
      useCORS: true,
      allowTaint: true,
      scale: Math.min(window.devicePixelRatio || 1, 2),
      logging: false,
    });
    const label = (document.querySelector('.nav-tab.active')?.textContent.trim() || 'nova').replace(/\s+/g,'-');
    const a = document.createElement('a');
    a.download = `nova-${label}-${new Date().toISOString().slice(0,10)}.png`;
    a.href = canvas.toDataURL('image/png');
    a.click();
  } catch(e) {
    alert('截图失败：' + e.message);
  } finally {
    btns.forEach(b => { b.style.visibility = ''; b.disabled = false; });
    btn.innerHTML = origHTML;
  }
}

renderAll();
</script>
</body>
</html>
